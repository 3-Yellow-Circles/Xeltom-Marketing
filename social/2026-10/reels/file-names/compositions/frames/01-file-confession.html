      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="01-file-confession"]');

      // Split each file name into hidden characters plus a trailing caret.
      const names = [1, 2, 3].map((n) => {
        const el = root.querySelector("#f01-name" + n);
        const text = el.getAttribute("data-text");
        el.innerHTML = text.split("").map((c) => '<span class="ch">' + (c === " " ? "&nbsp;" : c) + "</span>").join("") + '<span class="f01-caret"></span>';

      // Types a name between two voice cues; the caret shows while typing.
      const type = (i, start, end) => {
        const { chars, caret } = names[i];
        const step = (end - start) / chars.length;
        tl.set(caret, { opacity: 1 }, start);
        chars.forEach((c, k) => tl.set(c, { display: "inline" }, start + k * step));

      };
